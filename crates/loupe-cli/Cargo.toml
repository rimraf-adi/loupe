[package]
name = "loupe-cli"
description = "Client and debug/inspect commands"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "loupe"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Neural embedder (candle). Off by default; `--embedder <id>` then selects a fetched model.
real-embedder = ["loupe-model/real-embedder"]
accelerate = ["loupe-model/accelerate"]

[dependencies]
loupe-model.workspace = true
loupe-api.workspace = true
loupe-daemon.workspace = true
loupe-proto.workspace = true
loupe-mcp.workspace = true
loupe-core.workspace = true
anyhow.workspace = true
clap.workspace = true
signal-hook.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
serde_json.workspace = true
