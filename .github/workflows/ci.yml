name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: release binary smoke test
        run: |
          cargo build --release --locked -p loupe-cli
          d=$(mktemp -d)
          mkdir -p "$d/src" "$d/target" && printf 'pub fn smoke_marker() {}\n' > "$d/src/lib.rs"
          printf 'Signature: 8a477f597d28d172789f06886806bc55\n' > "$d/target/CACHEDIR.TAG"
          printf 'pub fn must_not_be_indexed() {}\n' > "$d/target/x.rs"
          ./target/release/loupe index -C "$d"
          ./target/release/loupe search smoke_marker -C "$d" -l | grep -q src/lib.rs
          ! ./target/release/loupe search must_not_be_indexed -C "$d" -l | grep -q .
          ./target/release/loupe status -C "$d"
      - run: cargo bench --workspace -- --test

  windows-compile:
    name: compile-only (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
