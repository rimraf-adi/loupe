[package]
name = "loupe"
version = "0.1.0"
edition = "2021"
description = "Fast, budgeted code reader MCP server for AI coding agents"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "loupe"
path = "src/main.rs"
