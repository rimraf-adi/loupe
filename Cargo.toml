[package]
name = "loupe"
version = "0.1.0"
edition = "2021"
description = "Fast, budgeted code reader MCP server for AI coding agents"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
anyhow = "1.0"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
ignore = "0.4.34"
glob = "0.3.4"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "loupe"
path = "src/main.rs"
